databases:
  - name: clube-cde-db
    plan: free
    databaseName: clube_cde
    user: clube_cde

services:
  - type: web
    name: clube-cde
    runtime: static
    buildCommand: ""
    staticPublishPath: ./
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: clube-cde-api
    runtime: node
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && node index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clube-cde-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: SITE_ORIGIN
        value: https://clube-cde.onrender.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: HUBLA_WEBHOOK_TOKEN
        sync: false
